<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bid Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>

  <nav id="tabs">
    <button class="tab-btn active" data-view="board" type="button">Board</button>
    <button class="tab-btn" data-view="map" type="button">Map</button>
    <button class="tab-btn" data-view="schedule" type="button">Schedule</button>
    <button id="add-job-btn" type="button">
      <span class="add-icon">+</span><span class="add-label">New job</span>
    </button>
  </nav>

  <main id="views">
    <section id="view-board" class="view active">
      <div id="board-filter"></div>
      <div id="board"></div>
    </section>

    <section id="view-map" class="view">
      <div id="map-toolbar">
        <button id="route-panel-toggle" type="button">Route ▾</button>
        <span id="map-status"></span>
      </div>

      <div id="route-panel" class="hidden">
        <div class="route-row">
          <span class="route-label">Start</span>
          <button class="route-opt active" data-start-mode="gps" type="button">My location</button>
          <button class="route-opt" data-start-mode="job" type="button">Choose job</button>
        </div>
        <select id="start-job-select" class="job-select hidden"></select>

        <div class="route-row">
          <span class="route-label">Include</span>
        </div>
        <div id="status-chip-row" class="chip-row"></div>

        <div class="route-row">
          <span class="route-label">Stops</span>
        </div>
        <div id="stop-chip-row" class="chip-row"></div>

        <div class="route-row">
          <span class="route-label">End</span>
          <button class="route-opt active" data-end-mode="optimize" type="button">Optimize</button>
          <button class="route-opt" data-end-mode="roundtrip" type="button">Round trip</button>
          <button class="route-opt" data-end-mode="job" type="button">Choose job</button>
        </div>
        <select id="end-job-select" class="job-select hidden"></select>

        <div class="route-actions">
          <button id="clear-filters-btn" type="button">Clear filters</button>
          <button id="route-btn" type="button">Route</button>
        </div>
      </div>

      <div id="map"></div>
    </section>

    <section id="view-schedule" class="view">
      <div id="cal-toolbar">
        <button id="cal-prev" type="button" aria-label="Previous">&lsaquo;</button>
        <span id="cal-label"></span>
        <button id="cal-next" type="button" aria-label="Next">&rsaquo;</button>
        <button id="cal-today" type="button">Today</button>
        <div class="cal-mode-switch">
          <button class="cal-mode-btn" data-mode="month" type="button">Month</button>
          <button class="cal-mode-btn" data-mode="week" type="button">Week</button>
          <button class="cal-mode-btn" data-mode="day" type="button">Day</button>
        </div>
      </div>
      <div id="cal-body"></div>
    </section>
  </main>

  <div id="job-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="job-modal-title">Job</h2>
        <button id="job-modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="job-form">
        <label>Customer
          <input name="customerName" type="text">
        </label>
        <label>Phone
          <input name="phone" type="tel">
        </label>
        <label class="address-field">Address
          <input id="job-address" name="address" type="text" autocomplete="off">
          <ul id="job-address-suggestions" class="suggestions"></ul>
        </label>
        <label>Status
          <select id="job-status" name="status"></select>
        </label>
        <label>Walk-down date
          <input name="walkdownDate" type="date">
        </label>
        <label>Scheduled start
          <input name="scheduledStart" type="datetime-local">
        </label>
        <label>Scheduled end
          <input name="scheduledEnd" type="datetime-local">
        </label>
        <label>Notes
          <textarea name="notes" rows="4"></textarea>
        </label>
        <div class="modal-actions">
          <button id="job-delete-btn" type="button" class="danger hidden">Delete</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
