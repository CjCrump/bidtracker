<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bid Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
</head>
<body>

  <nav id="tabs">
    <button class="tab-btn active" data-view="board" type="button">Board</button>
    <button class="tab-btn" data-view="map" type="button">Map</button>
    <button class="tab-btn" data-view="schedule" type="button">Schedule</button>
    <button id="add-job-btn" type="button">+ New job</button>
  </nav>

  <main id="views">
    <section id="view-board" class="view active">
      <div id="board"></div>
    </section>

    <section id="view-map" class="view">
      <div id="map-toolbar">
        <select id="map-status-filter">
          <option value="walkdown">Walk-down</option>
          <option value="estimate">Estimate</option>
          <option value="sent">Sent</option>
          <option value="scheduled">Scheduled</option>
          <option value="done">Done</option>
          <option value="lost">Lost</option>
          <option value="all">All</option>
        </select>
        <button id="route-btn" type="button">Route these jobs</button>
        <span id="map-status"></span>
      </div>
      <div id="map"></div>
    </section>

    <section id="view-schedule" class="view">
      <div id="schedule-list"></div>
    </section>
  </main>

  <div id="job-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="job-modal-title">Job</h2>
        <button id="job-modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <form id="job-form">
        <label>Customer
          <input name="customerName" type="text">
        </label>
        <label>Phone
          <input name="phone" type="tel">
        </label>
        <label class="address-field">Address
          <input id="job-address" name="address" type="text" autocomplete="off">
          <ul id="job-address-suggestions" class="suggestions"></ul>
        </label>
        <label>Status
          <select id="job-status" name="status"></select>
        </label>
        <label>Walk-down date
          <input name="walkdownDate" type="date">
        </label>
        <label>Scheduled start
          <input name="scheduledStart" type="datetime-local">
        </label>
        <label>Scheduled end
          <input name="scheduledEnd" type="datetime-local">
        </label>
        <label>Notes
          <textarea name="notes" rows="4"></textarea>
        </label>
        <div class="modal-actions">
          <button id="job-delete-btn" type="button" class="danger hidden">Delete</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
